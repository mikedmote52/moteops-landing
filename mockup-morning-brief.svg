<svg width="820" height="600" viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mockup of the owner morning brief screen, sample data">
  <defs>
    <style>
      .lbl { font-family: -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="820" height="600" fill="#F0EBE1"/>

  <!-- browser chrome -->
  <rect x="20" y="20" width="780" height="560" rx="14" fill="#FFFFFF" stroke="#DCD5C8" stroke-width="1.5"/>
  <rect x="20" y="20" width="780" height="40" rx="14" fill="#F0EBE1"/>
  <circle cx="44" cy="40" r="5" fill="#DCD5C8"/>
  <circle cx="62" cy="40" r="5" fill="#DCD5C8"/>
  <circle cx="80" cy="40" r="5" fill="#DCD5C8"/>
  <text x="400" y="45" text-anchor="middle" class="lbl" font-size="12" fill="#5B6763">moteops.app/brief</text>

  <!-- Sample data watermark -->
  <text x="770" y="590" text-anchor="end" class="lbl" font-size="12" fill="#9C9384" font-style="italic">Sample data — not a real customer</text>

  <!-- Page header -->
  <text x="52" y="100" class="lbl" font-size="22" font-weight="700" fill="#1C2321">Morning Brief</text>
  <text x="52" y="122" class="lbl" font-size="13" fill="#5B6763">Wednesday, July 8 · 6:02 AM · Sample data</text>

  <!-- Triage row -->
  <g class="lbl">
    <rect x="52" y="144" width="168" height="92" rx="10" fill="#FAF7F2" stroke="#DCD5C8"/>
    <circle cx="72" cy="166" r="5" fill="#8C3B2E"/>
    <text x="86" y="171" font-size="13" font-weight="700" fill="#8C3B2E">URGENT</text>
    <text x="68" y="200" font-size="28" font-weight="700" fill="#1C2321">2</text>
    <text x="68" y="220" font-size="11" fill="#5B6763">Sample: burst pipe, no-show tenant</text>

    <rect x="232" y="144" width="168" height="92" rx="10" fill="#FAF7F2" stroke="#DCD5C8"/>
    <circle cx="252" cy="166" r="5" fill="#8A6D2F"/>
    <text x="266" y="171" font-size="13" font-weight="700" fill="#8A6D2F">NEEDS REVIEW</text>
    <text x="248" y="200" font-size="28" font-weight="700" fill="#1C2321">6</text>
    <text x="248" y="220" font-size="11" fill="#5B6763">Sample: drafts ready for your yes</text>

    <rect x="412" y="144" width="168" height="92" rx="10" fill="#FAF7F2" stroke="#DCD5C8"/>
    <circle cx="432" cy="166" r="5" fill="#5B6763"/>
    <text x="446" y="171" font-size="13" font-weight="700" fill="#5B6763">READ</text>
    <text x="428" y="200" font-size="28" font-weight="700" fill="#1C2321">14</text>
    <text x="428" y="220" font-size="11" fill="#5B6763">Sample: newsletters, receipts</text>

    <rect x="592" y="144" width="168" height="92" rx="10" fill="#FAF7F2" stroke="#DCD5C8"/>
    <circle cx="612" cy="166" r="5" fill="#9C9384"/>
    <text x="626" y="171" font-size="13" font-weight="700" fill="#9C9384">TRASH</text>
    <text x="608" y="200" font-size="28" font-weight="700" fill="#1C2321">33</text>
    <text x="608" y="220" font-size="11" fill="#5B6763">Sample: spam, promos</text>
  </g>

  <!-- Lane summary list -->
  <text x="52" y="266" class="lbl" font-size="14" font-weight="700" fill="#1C2321">Lanes reporting in today (sample)</text>

  <g class="lbl" font-size="13" fill="#1C2321">
    <rect x="52" y="280" width="716" height="46" rx="8" fill="#FAF7F2" stroke="#DCD5C8"/>
    <text x="68" y="308">Reviews — 1 new negative review, response drafted, awaiting your edit</text>

    <rect x="52" y="332" width="716" height="46" rx="8" fill="#FAF7F2" stroke="#DCD5C8"/>
    <text x="68" y="360">After-hours intake — 2 callers last night, 1 tour requested, both logged</text>

    <rect x="52" y="384" width="716" height="46" rx="8" fill="#FAF7F2" stroke="#DCD5C8"/>
    <text x="68" y="412">Quotes — 1 estimate from last week, follow-up draft ready</text>

    <rect x="52" y="436" width="716" height="46" rx="8" fill="#FAF7F2" stroke="#DCD5C8"/>
    <text x="68" y="464">Invoices — 1 invoice at day 21, reminder draft ready</text>
  </g>

  <!-- footer note -->
  <text x="52" y="510" class="lbl" font-size="12" fill="#5B6763">Every line above is a draft. Nothing sends until you approve it.</text>
  <text x="52" y="530" class="lbl" font-size="11" fill="#9C9384">Mockup for illustration only — all names, counts, and messages are sample data.</text>
</svg>
